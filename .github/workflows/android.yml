# Android APK のビルド・署名・Release への添付。
# 通常は release.yml から workflow_call で呼ばれる（Release 作成と同時に APK が付く）。
# 手動再ビルドは Actions タブの workflow_dispatch から（tag に vX.Y.Z を指定）。
# 署名キーはリポジトリシークレット（ANDROID_KEYSTORE_B64 ほか）。鍵の実体と
# 復旧手順は Documents/my-phrases-signing/README.txt を参照（紛失＝更新不可）。
name: Build Android APK

on:
  workflow_call:
    inputs:
      tag:
        description: 'APKを添付するリリースタグ（例: v0.12.0）'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'APKを添付するリリースタグ（例: v0.12.0）。空なら apk-preview プレリリースに添付'
        required: false
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "preview=false" >> "$GITHUB_OUTPUT"
          else
            # タグ未指定（手動の先行ビルド）: 現在のブランチを apk-preview プレリリースへ
            echo "tag=apk-preview" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "preview=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Service Worker disabled for APK)
        run: npm run build
        env:
          CAPACITOR_BUILD: '1'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore and normalize secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RAW_STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAW_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RAW_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # base64 は改行が混ざっていても復号できるよう -d は寛容だが、念のため空白を除く
          printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.p12"
          # シークレット末尾に紛れ込んだ改行/復帰(\r)/空白を除去（CR混入対策）
          STORE_PW="$(printf '%s' "$RAW_STORE_PW" | tr -d '\r\n')"
          KEY_PW="$(printf '%s' "$RAW_KEY_PW" | tr -d '\r\n')"
          ALIAS="$(printf '%s' "$RAW_ALIAS" | tr -d '\r\n')"
          echo "::add-mask::$STORE_PW"
          echo "::add-mask::$KEY_PW"
          echo "STORE_PW=$STORE_PW" >> "$GITHUB_ENV"
          echo "KEY_PW=$KEY_PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          # 診断: 値は伏せ、長さ・バイト数だけ出す（新しいシークレットが入っているかの確認用）
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/release.p12")"
          echo "store password length: ${#STORE_PW}"
          echo "key password length: ${#KEY_PW}"
          echo "alias: $ALIAS (length ${#ALIAS})"
          # キーストアが本当にこのパスワードで開くかを署名前に検証（失敗理由を早期に特定）
          if openssl pkcs12 -info -in "$RUNNER_TEMP/release.p12" -passin "pass:$STORE_PW" -noenc -nokeys >/dev/null 2>&1; then
            echo "keystore opens with STORE_PW: OK"
          else
            echo "keystore does NOT open with STORE_PW (password mismatch — シークレット再登録が必要)"
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ env.STORE_PW }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KEY_PW }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Ensure preview prerelease exists
        if: steps.target.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk-preview -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk-preview -R "$GITHUB_REPOSITORY" --prerelease \
              --title "APK preview（動作確認用）" \
              --notes "実機検証用の先行ビルド。正式版は各バージョンの Release から。"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          cp android/app/build/outputs/apk/release/app-release.apk "my-phrases-$TAG.apk"
          gh release upload "$TAG" "my-phrases-$TAG.apk" -R "$GITHUB_REPOSITORY" --clobber
